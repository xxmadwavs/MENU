<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* despensa / jardín — paleta propia */
  --paper:       #f3efe2;
  --paper-raised:#fffdf8;
  --ink:         #262b1f;
  --ink-soft:    #71715f;
  --line:        #e2dbc4;

  --green:       #33472c;
  --green-deep:  #23301e;
  --green-light: #e7ebdd;

  --gold:        #cf9a3e;
  --gold-deep:   #a97928;
  --gold-light:  #f8ecd2;

  --clay:        #b3573d;
  --clay-light:  #f6e3da;

  --plum:        #6c4569;
  --plum-light:  #ece2ea;

  --sage:        #728a5d;
  --sage-light:  #e7edde;

  --berry:       #a24f68;
  --berry-light: #f4e1e7;

  --r:    18px;
  --r-sm: 11px;
  --shadow: 0 3px 14px rgba(38,43,31,.07);
  --shadow-lg: 0 10px 34px rgba(38,43,31,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  background-image:radial-gradient(circle at 100% 0%, rgba(207,154,62,.08), transparent 45%);
  color:var(--ink);
  min-height:100vh;
  font-size:15px;
  padding-bottom:74px;
}
h1,h2,.font-display{font-family:'Fraunces',serif}
.mono{font-family:'IBM Plex Mono',monospace}

/* MICRO-LABEL unificado — mismo tratamiento tipográfico para toda etiqueta pequeña en mayúsculas;
   el color (no el tamaño) distingue "esto es una etiqueta" de "esto es un dato" */
.cal-head,
.meal-type-label,
.mbox .ml,
.mm-box .l,
.sec-lbl,
.rg-totals .tl,
.rg-field label,
.dti-body label,
.dms-l,
.dbh-label,
.dr-box .drl{
  font-size:.64rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.045em;
  color:var(--ink-soft);
}

/* INPUTS unificados — mismo tratamiento visual que el resto de tarjetas de la app */
.rg-field input,.rg-field textarea,
.recipe-search,
.ring-qty input,
.rg-extra-row input{
  background:var(--paper);
  border:1.5px solid var(--line);
  border-radius:var(--r-sm);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  box-shadow:inset 0 1px 3px rgba(38,43,31,.05);
  transition:border-color .15s, box-shadow .15s;
}
.rg-field input:focus,.rg-field textarea:focus,
.recipe-search:focus,
.ring-qty input:focus,
.rg-extra-row input:focus{
  outline:none;border-color:var(--green);
  box-shadow:inset 0 1px 3px rgba(38,43,31,.05), 0 0 0 3px var(--green-light);
}

/* HEADER */
header{
  background:linear-gradient(160deg,var(--green) 0%,var(--green-deep) 100%);
  padding:1.15rem 1.25rem 1.3rem;
  position:sticky;top:0;z-index:100;
  box-shadow:0 6px 20px rgba(35,48,30,.22);
  border-bottom:3px solid var(--gold);
}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(207,154,62,.5);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold-light);
}
.brand-mark svg{display:block}
header h1{font-size:1.28rem;font-weight:600;color:#fbf6ea;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:.72rem;color:rgba(251,246,234,.65);margin-top:2px;text-transform:capitalize;letter-spacing:.02em}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:150;
  background:var(--paper-raised);
  border-top:1px solid var(--line);
  display:flex;
  box-shadow:0 -6px 20px rgba(38,43,31,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:.6rem .25rem .55rem;
  color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:.66rem;font-weight:600;
  letter-spacing:.02em;position:relative;transition:color .15s;
}
.nav-btn .nav-icon{display:flex;transition:transform .18s}
.nav-btn .nav-icon svg{display:block}
.nav-btn.active{color:var(--green)}
.nav-btn.active .nav-icon{transform:translateY(-2px)}
.nav-btn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold);
}

.view{display:none;padding:1.05rem 1.1rem 1.5rem}
.view.active{display:block}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4.5rem 1rem;color:var(--ink-soft);gap:1rem}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* WEEK NAV */
.week-nav{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;
  background:var(--paper-raised);border-radius:var(--r);padding:.6rem .7rem;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.week-nav button{
  background:var(--green-light);border:none;width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-size:1.15rem;color:var(--green);display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.week-nav button:hover{background:var(--green);color:#fff}
.week-nav button:disabled{opacity:.28;cursor:default}
.week-nav button:disabled:hover{background:var(--green-light);color:var(--green)}
.week-nav-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.week-nav-label{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--green-deep);font-style:italic}
.week-nav-range{font-size:.66rem;color:var(--ink-soft);font-weight:500;letter-spacing:.01em}
.week-nav-dots{display:flex;gap:6px}
.week-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s;cursor:pointer}
.week-dot.active{background:var(--green);transform:scale(1.25)}

/* CALENDAR GRID */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:0;background:var(--paper-raised);
  border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);margin-bottom:.85rem;
}
.cal-head{
  background:var(--green);color:#f2ecda;text-align:center;padding:.5rem 2px;
  letter-spacing:.07em;
}
.cal-cell{
  border-right:1px solid var(--line);border-top:1px solid var(--line);
  min-height:78px;cursor:pointer;transition:background .15s;position:relative;
  display:flex;flex-direction:column;align-items:center;padding-top:5px;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--green-light)}
.cal-cell.today .cal-num{background:var(--green-deep);color:#fff}
.cal-cell.has-food{background:#faf6ea}
.cal-cell.selected{background:var(--green-light);box-shadow:inset 0 0 0 2px var(--green);z-index:1}
.cal-num{font-size:.72rem;font-weight:700;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cal-dots{display:flex;gap:3px;padding:5px 0 3px;flex-wrap:wrap;justify-content:center;max-width:34px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-desayuno{background:var(--gold-deep)}
.dot-comida{background:var(--sage)}
.dot-cena{background:var(--plum)}
.dot-snack{background:var(--clay)}
.dot-postre{background:var(--berry)}
.cal-kcal{font-size:.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:center;line-height:1;padding-bottom:5px}

/* DAY PANEL */
.day-panel{background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:1rem}
.day-panel-head{
  background:linear-gradient(150deg,var(--green),var(--green-deep));
  padding:.95rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.day-panel-title{font-family:'Fraunces',serif;color:#fbf6ea;font-size:1.05rem;font-weight:600;font-style:italic;flex-shrink:0}
.day-ring-wrap{display:flex;align-items:center;gap:.8rem;margin-left:auto}
.day-ring{flex-shrink:0}
.day-kcal-num{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;fill:#fbf6ea}
.day-macro-legend{display:flex;flex-direction:column;gap:3px}
.dml-row{display:flex;align-items:center;gap:5px;font-size:.66rem;color:rgba(251,246,234,.85);font-weight:600}
.dml-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dml-row .mono{color:#fbf6ea}
.day-empty-badge{font-size:.72rem;color:rgba(251,246,234,.7);font-style:italic;margin-left:auto}

.meal-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.1rem;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.meal-item:last-child{border-bottom:none}
.meal-item:hover{background:var(--green-light)}
.meal-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meal-icon svg{display:block}
.mi-desayuno{background:var(--gold-light)}
.mi-comida{background:var(--sage-light)}
.mi-cena{background:var(--plum-light)}
.mi-snack{background:var(--clay-light)}
.meal-info{flex:1;min-width:0}
.meal-type-label{margin-bottom:1px}
.meal-name-t{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-name-t.empty{color:var(--ink-soft);font-weight:400;font-style:italic}
.meal-macros-r{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.mm{font-size:.65rem;font-weight:700;font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:8px}
.mm-k{background:var(--clay-light);color:#8a3d27}
.mm-p{background:var(--sage-light);color:#3f5c2c}
.mm-c{background:var(--gold-light);color:#8a6416}
.mm-g{background:var(--plum-light);color:#523153}

/* RECIPES */
.recipe-search{
  width:100%;padding:.65rem .9rem;font-size:.85rem;margin-bottom:.7rem;
}
.recipe-search::placeholder{color:var(--ink-soft)}
.sub-tabs{display:flex;background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);padding:4px;margin-bottom:1rem;gap:3px;box-shadow:var(--shadow);overflow-x:auto}
.sub-tab{flex:1;text-align:center;padding:.45rem .2rem;border-radius:var(--r-sm);font-size:.72rem;font-weight:700;cursor:pointer;border:none;background:none;color:var(--ink-soft);transition:all .2s;white-space:nowrap}
.sub-tab.active{background:var(--green);color:#fbf6ea}
.recipe-count{font-size:.72rem;color:var(--ink-soft);font-weight:600;margin:0 0 .6rem 2px}
.recipes-grid{display:flex;flex-direction:column;gap:.7rem}
.recipe-card{background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);padding:1rem 1.1rem;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.recipe-card:hover{border-color:var(--line);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.recipe-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.4rem;gap:.5rem}
.recipe-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;flex:1;line-height:1.3}
.recipe-time{font-size:.68rem;color:#3f5c2c;background:var(--sage-light);padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:700;font-family:'IBM Plex Mono',monospace}
.recipe-desc{font-size:.81rem;color:var(--ink-soft);margin-bottom:.75rem;line-height:1.5}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mbox{border-radius:9px;padding:6px 4px;text-align:center}
.mbox .mv{font-size:.85rem;font-weight:700;display:block;font-family:'IBM Plex Mono',monospace}
.mbox .ml{display:block;margin-top:2px}
.mb-k{background:var(--clay-light)}.mb-k .mv{color:#8a3d27}.mb-k .ml{color:#a3503a}
.mb-p{background:var(--sage-light)}.mb-p .mv{color:#3f5c2c}.mb-p .ml{color:#597a45}
.mb-c{background:var(--gold-light)}.mb-c .mv{color:#8a6416}.mb-c .ml{color:#a97e20}
.mb-g{background:var(--plum-light)}.mb-g .mv{color:#523153}.mb-g .ml{color:#6c4569}

/* SHOPPING */
.shop-week-tabs{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap}
.shop-week-btn{padding:.4rem .85rem;border-radius:20px;border:1.5px solid var(--line);background:var(--paper-raised);font-family:'Inter',sans-serif;font-size:.76rem;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .2s}
.shop-week-btn.active{background:var(--green);border-color:var(--green);color:#fbf6ea}
.info-bar{background:var(--sage-light);border-radius:var(--r);border:1px solid var(--line);padding:.7rem 1rem;margin-bottom:.75rem;font-size:.8rem;color:#3f5c2c;font-weight:600;box-shadow:var(--shadow)}
.shop-progress{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r);padding:.7rem 1rem;margin-bottom:.75rem;box-shadow:var(--shadow)}
.shop-progress-top{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;color:var(--ink-soft);margin-bottom:.4rem}
.shop-progress-bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.shop-progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .25s}
.shop-item{background:var(--paper-raised);border-radius:var(--r-sm);border:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;margin-bottom:6px;cursor:pointer;transition:all .18s}
.shop-item:hover{border-color:var(--green)}
.shop-item.checked{opacity:.5}
.shop-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--green);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.shop-item.checked .shop-check{background:var(--green);border-color:var(--green)}
.shop-item.checked .shop-check::after{content:'✓';color:#fbf6ea;font-size:.72rem;font-weight:700}
.shop-item.checked .stxt{text-decoration:line-through;color:var(--ink-soft)}
.stxt{font-size:.9rem;font-weight:600;flex:1}
.sqty{font-size:.76rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
.btn-reset{width:100%;background:none;border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:.65rem;font-family:'Inter',sans-serif;font-size:.83rem;font-weight:600;color:var(--ink-soft);cursor:pointer;margin-top:.75rem;transition:all .2s}
.btn-reset:hover{background:var(--clay-light);color:var(--clay);border-color:var(--clay)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(35,30,20,.55);z-index:200;padding:1rem;overflow-y:auto;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--paper-raised);border-radius:var(--r);width:100%;max-width:480px;margin-top:2rem;margin-bottom:2rem;overflow:hidden;box-shadow:0 24px 60px rgba(35,30,20,.3)}
.modal-head{background:linear-gradient(150deg,var(--green),var(--green-deep));color:#fbf6ea;padding:1.15rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;border-bottom:3px solid var(--gold)}
.modal-head h2{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;line-height:1.3;font-style:italic}
.modal-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fbf6ea;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.15rem 1.25rem}
.modal-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem}
.mm-box{border-radius:11px;padding:9px 4px;text-align:center}
.mm-box .v{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:600;display:block}
.mm-box .l{display:block;margin-top:2px}
.sec-lbl{margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.4rem}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--line)}
.ing-list{list-style:none}
.ing-list li{padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem;display:flex;justify-content:space-between;align-items:center}
.ing-list li:last-child{border-bottom:none}
.ing-qty{color:var(--ink-soft);font-size:.8rem;font-family:'IBM Plex Mono',monospace}
.steps-ol{list-style:none;counter-reset:s}
.steps-ol li{counter-increment:s;padding:.6rem 0 .6rem 2.3rem;border-bottom:1px solid var(--line);font-size:.86rem;line-height:1.55;position:relative;color:var(--ink)}
.steps-ol li:last-child{border-bottom:none}
.steps-ol li::before{content:counter(s);position:absolute;left:0;top:.6rem;width:21px;height:21px;background:var(--green);color:#fbf6ea;border-radius:50%;font-size:.66rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-soft)}
.empty-state .ei{font-size:2.4rem;margin-bottom:.75rem;opacity:.85}
.empty-state p{font-size:.9rem;line-height:1.55;max-width:280px;margin:0 auto}

/* REGISTRO REAL */
.day-real-row{display:flex;align-items:center;gap:8px;padding:.55rem 1.1rem;background:var(--sage-light);border-bottom:1px solid var(--line);font-size:.76rem;font-weight:700;color:#3f5c2c}
.day-real-row .drr-icon{font-size:.85rem}
.day-real-row .mono{margin-left:auto}
.cal-check{position:absolute;top:3px;right:4px;width:13px;height:13px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#fff;font-weight:700}
.meal-item{position:relative}
.meal-body{display:flex;align-items:center;gap:.75rem;flex:1;min-width:0;cursor:pointer}
.reg-badge{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:4px}
.rb-como_plan{background:var(--sage-light);color:#3f5c2c}
.rb-otra_receta{background:var(--gold-light);color:#8a6416}
.rb-libre{background:var(--plum-light);color:#523153}
.rb-no_comido{background:var(--clay-light);color:#8a3d27}
.reg-edit-btn{flex-shrink:0;background:var(--paper);border:1.5px solid var(--line);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.reg-edit-btn:hover{border-color:var(--green);background:var(--green-light)}
.postre-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.65rem 1.1rem;border-bottom:1px solid var(--line);background:var(--berry-light)}
.postre-toggle-row .ptr-label{font-size:.8rem;font-weight:600;color:var(--ink)}
.ptr-add-btn{background:var(--berry);color:#fff;border:none;border-radius:20px;padding:.4rem .85rem;font-size:.72rem;font-weight:700;cursor:pointer}

/* modal registro */
.rg-src-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem}
.rg-src-tab{flex:1;min-width:100px;text-align:center;padding:.5rem .3rem;border-radius:var(--r-sm);font-size:.7rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);transition:all .18s}
.rg-src-tab.active{background:var(--green);border-color:var(--green);color:#fbf6ea}
.rg-ref-card{background:var(--sage-light);border-radius:var(--r-sm);padding:.65rem .8rem;margin-bottom:1rem;font-size:.78rem;color:#3f5c2c}
.rg-ref-card b{font-family:'Fraunces',serif;font-style:italic}
.rg-recipe-picker{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:.9rem}
.rg-rp-item{padding:.6rem .8rem;border-bottom:1px solid var(--line);cursor:pointer;font-size:.83rem;display:flex;justify-content:space-between;gap:.5rem}
.rg-rp-item:last-child{border-bottom:none}
.rg-rp-item:hover{background:var(--green-light)}
.rg-rp-item.picked{background:var(--sage-light);font-weight:700}
.rg-rp-item .rpk{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-soft)}
.ring-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.ring-row:last-child{border-bottom:none}

.rg-extra-row{display:grid;grid-template-columns:1.1fr .55fr .5fr .5fr .5fr .5fr auto;gap:5px;padding:.5rem 0;border-bottom:1px solid var(--line);align-items:center}
.rg-extra-row input{border-radius:7px;padding:.35rem;font-size:.72rem;width:100%}
.rg-extra-del{background:var(--clay-light);color:var(--clay);border:none;width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:.7rem}

.rg-btn{flex:1;border:none;border-radius:var(--r-sm);padding:.75rem;font-family:'Inter',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .15s}
.rg-btn-save{background:var(--green);color:#fbf6ea}

.rg-btn-del{background:var(--clay-light);color:var(--clay)}
.rg-btn-del:hover{background:var(--clay);color:#fff}

<script>
const DIAS=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_S={lunes:'L',martes:'M',miercoles:'X',jueves:'J',viernes:'V',sabado:'S',domingo:'D'};
const DIAS_L={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
const TIPOS=['desayuno','comida','cena','snack'];
const TIPO_I={desayuno:'☀️',comida:'🍽️',cena:'🌙',snack:'🍎'};
const ICON_TIPO={
  desayuno:'<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"/><path d="M10 3v1.7M10 15.3V17M17 10h-1.7M4.7 10H3M15.1 4.9l-1.2 1.2M6.1 13.9 4.9 15.1M15.1 15.1l-1.2-1.2M6.1 6.1 4.9 4.9"/></svg>',
  comida:'<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="6.7"/><circle cx="10" cy="10" r="2.7"/></svg>',
  cena:'<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 12.6A6.1 6.1 0 1 1 7.4 4.4a5.1 5.1 0 0 0 8.2 8.2Z"/></svg>',
  snack:'<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7.4c1-1.7 3.1-2.3 4.6-1.2 1.6 1.1 2 3.7.7 6.1-1.3 2.4-3.3 4.6-5.3 4.6s-4-2.2-5.3-4.6c-1.3-2.4-.9-5 .7-6.1 1.5-1.1 3.6-.5 4.6 1.2Z"/><path d="M10 7.4V5.4c0-.9.6-1.5 1.4-1.7"/></svg>'
};
const SEMANAS=['semana1','semana2','semana3','semana4'];
const SEM_L=['Semana 1','Semana 2','Semana 3','Semana 4'];

// Semana 1 empezó el domingo 25 de mayo de 2026
const SEMANA1_INICIO = new Date(2026, 4, 25); // mes 4 = mayo (0-indexed)

function calcCurrentWeek(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diffMs = hoy - SEMANA1_INICIO;
  const diffDias = Math.floor(diffMs / (1000*60*60*24));
  const semanaNum = Math.floor(diffDias / 7);
  return ((semanaNum % 4) + 4) % 4; // siempre 0-3, funciona aunque sea negativo
}

// ── Supabase (registro real de lo comido) ──
const SUPABASE_URL = 'https://loigbzqckpapaxugudjx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvaWdienFja3BhcGF4dWd1ZGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzY5MzgsImV4cCI6MjEwNDM1MjkzOH0.JeH7_Dxae0sRX5qdpWnB3o0eTcJ_0rr6x7-5ZHbUObc';
let sb=null;
try{ sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ console.warn('Supabase no configurado todavía', e); }

const POSTRE_KEY={comida:'postre_comida',cena:'postre_cena'};

let DATA=null, currentWeek=calcCurrentWeek(), selectedDay=null, checkedItems={}, recipeFilter='desayuno', shopWeek=calcCurrentWeek();
let REGISTRO={}; // 'YYYY-MM-DD|tipo' -> row
let INGREDIENTES_EXTRA=[]; // ingredientes nuevos guardados en Supabase (además de los de data.json)
let rgState=null; // estado del modal de registro abierto

// ── Diario (peso, pasos, déficit, ciclo) ──
let PERFIL=null;
let DIARIO={};   // 'YYYY-MM-DD' -> {fecha,peso,pasos,notas}
let CICLOS=[];    // [{fecha_inicio,notas}]
let diarioMonthDate=new Date(); diarioMonthDate.setDate(1); diarioMonthDate.setHours(0,0,0,0);
let diarioSelectedFecha=isoDate(new Date());
let diarioSaveTimer=null;
let diarioChartMode='todo'; // 'todo' | 'mes' | 'anio' — rango mostrado en el gráfico de peso
let diarioChartYear=new Date().getFullYear();

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getFechaDia(dia,weekIdx){
  const idx=DIAS.indexOf(dia);
  const mon=getWeekMonday(weekIdx==null?currentWeek:weekIdx);
  const d=new Date(mon); d.setDate(mon.getDate()+idx);
  return isoDate(d);
}
function regKey(fecha,tipo){ return fecha+'|'+tipo; }
function catalogoIngredientes(){ return (DATA.ingredientes||[]).concat(INGREDIENTES_EXTRA||[]); }

async function loadRegistroRango(){
  if(!sb) return;
  try{
    const mondays=[0,1,2,3].map(getWeekMonday);
    const min=new Date(Math.min(...mondays.map(d=>d.getTime())));
    const max=new Date(Math.max(...mondays.map(d=>d.getTime()))); max.setDate(max.getDate()+6);
    const {data,error}=await sb.from('registro_diario').select('*').gte('fecha',isoDate(min)).lte('fecha',isoDate(max));
    if(error){ console.warn('Error cargando registro:',error.message); return; }
    REGISTRO={};
    (data||[]).forEach(row=>{ REGISTRO[regKey(row.fecha,row.tipo)]=row; });
  }catch(e){ console.warn('Error cargando registro:',e); }
}

async function loadPerfil(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('perfil').select('*').eq('id',1).single();
    if(!error) PERFIL=data;
  }catch(e){ console.warn('No se pudo cargar el perfil:',e); }
}
async function loadDiario(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('diario').select('*');
    if(error) return;
    DIARIO={};
    (data||[]).forEach(r=>{ DIARIO[r.fecha]=r; });
  }catch(e){ console.warn('No se pudo cargar el diario:',e); }
}
async function loadCiclos(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('ciclo').select('*').order('fecha_inicio');
    if(!error) CICLOS=data||[];
  }catch(e){ console.warn('No se pudieron cargar los ciclos:',e); }
}

async function loadIngredientesExtra(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('ingredientes').select('*');
    if(error){ console.warn('Error cargando ingredientes guardados:',error.message); return; }
    INGREDIENTES_EXTRA=data||[];
  }catch(e){ console.warn('Error cargando ingredientes guardados:',e); }
}

async function loadData(){
  try{
    const r=await fetch('data.json?t='+Date.now());
    DATA=await r.json();
  }catch(e){ DATA={recetas:[],menu:{}}; }
  document.getElementById('today-label').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  await Promise.all([loadRegistroRango(), loadIngredientesExtra(), loadPerfil(), loadDiario(), loadCiclos()]);

function getR(id){ return DATA.recetas.find(r=>r.id===id)||null; }

// Combina lo planificado con el registro real guardado: si hay registro para un hueco, manda;
// si no, se asume lo planificado como estimación.
function computeRealDia(dia,fecha,dm){
  dm=dm||getMenuDia(dia);
  let kcal=0,proteinas=0,carbos=0,grasas=0;
  const slots={};
  const todosTipos=TIPOS.concat(['postre_comida','postre_cena']);
  todosTipos.forEach(t=>{
    const reg=REGISTRO[regKey(fecha,t)];
    const planR=getR(dm[t]);
    let s;
    if(reg){ s={source:'registro',estado:reg.estado,kcal:reg.kcal||0,proteinas:reg.proteinas||0,carbos:reg.carbos||0,grasas:reg.grasas||0}; }
    else if(planR){ s={source:'plan',estado:null,kcal:planR.kcal||0,proteinas:planR.proteinas||0,carbos:planR.carbos||0,grasas:planR.grasas||0}; }
    else{ s={source:'none',estado:null,kcal:0,proteinas:0,carbos:0,grasas:0}; }
    slots[t]=s;
    kcal+=s.kcal; proteinas+=s.proteinas; carbos+=s.carbos; grasas+=s.grasas;
  });
  return {kcal,proteinas,carbos,grasas,slots};
}

// ── Diario: helpers que funcionan para CUALQUIER fecha, sin depender ──
// ── de la semana seleccionada en la pestaña Calendario. ──
const DIA_KEY_POR_JS_DAY=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];

function weekIndexForDate(date){
  const diffDias=Math.floor((date-SEMANA1_INICIO)/(1000*60*60*24));
  const semanaNum=Math.floor(diffDias/7);
  return ((semanaNum%4)+4)%4;
}
function menuDelDia(fechaISO){
  const date=new Date(fechaISO+'T00:00:00');
  const dia=DIA_KEY_POR_JS_DAY[date.getDay()];
  const sem=SEMANAS[weekIndexForDate(date)];
  const menu=DATA.menu||{};
  const dm=(menu[sem]?menu[sem][dia]:menu[dia])||{};
  return {dia,dm};
}
function kcalConsumidasFecha(fechaISO){
  const {dia,dm}=menuDelDia(fechaISO);
  return computeRealDia(dia,fechaISO,dm).kcal;
}
function proteinasConsumidasFecha(fechaISO){
  const {dia,dm}=menuDelDia(fechaISO);
  return computeRealDia(dia,fechaISO,dm).proteinas;
}

// Info de peso para una fecha: el propio dato de ese día, o si no hay,
// el último conocido anterior (o el más próximo). Indica si es "de hoy" o arrastrado.
function pesoInfoFecha(fechaISO){
  if(DIARIO[fechaISO] && DIARIO[fechaISO].peso!=null) return {peso:DIARIO[fechaISO].peso,deHoy:true,fecha:fechaISO};
  const anteriores=Object.keys(DIARIO).filter(f=>DIARIO[f].peso!=null && f<=fechaISO).sort();
  if(anteriores.length){ const f=anteriores[anteriores.length-1]; return {peso:DIARIO[f].peso,deHoy:false,fecha:f}; }
  const cualquiera=Object.keys(DIARIO).filter(f=>DIARIO[f].peso!=null).sort();
  if(cualquiera.length) return {peso:DIARIO[cualquiera[0]].peso,deHoy:false,fecha:cualquiera[0]};
  return null;
}
// Último peso conocido en o antes de la fecha (o el más próximo si no hay ninguno anterior)
function pesoParaFecha(fechaISO){
  const info=pesoInfoFecha(fechaISO);
  return info?info.peso:null;
}
function edadPerfil(){
  if(!PERFIL||!PERFIL.fecha_nacimiento) return null;
  const hoy=new Date(), nac=new Date(PERFIL.fecha_nacimiento+'T00:00:00');
  let edad=hoy.getFullYear()-nac.getFullYear();
  const m=hoy.getMonth()-nac.getMonth();
  if(m<0||(m===0&&hoy.getDate()<nac.getDate())) edad--;
  return edad;
}
// Gasto calórico del día SIN el ajuste aprendido (Mifflin-St Jeor + pasos)
function gastoBaseFecha(fechaISO){
  const peso=pesoParaFecha(fechaISO);
  if(!PERFIL||peso==null) return null;
  let bmr;
  if(PERFIL.tmb_manual!=null){
    // TMB confirmada por apps/dispositivos: se usa directamente como base,
    // en vez de estimarla con la fórmula de Mifflin-St Jeor.
    bmr=PERFIL.tmb_manual;
  }else{
    const edad=edadPerfil();
    if(!PERFIL.altura_cm||edad==null) return null;
    bmr=10*peso+6.25*PERFIL.altura_cm-5*edad-161; // fórmula mujer (Mifflin-St Jeor)
  }
  const row=DIARIO[fechaISO];
  const pasos=(row&&row.pasos)||0;
  const kcalPasos=pasos*0.04*(peso/70);
  // Kcal por ejercicio (equivalente MET): gimnasio/fuerza ~6 MET, cardio ~7.5 MET
  // kcal/min = MET * 3.5 * peso(kg) / 200
  const gymMin=(row&&row.gimnasio_min)||0;
  const cardioMin=(row&&row.cardio_min)||0;
  const kcalGym=gymMin*(6*3.5*peso/200);
  const kcalCardio=cardioMin*(7.5*3.5*peso/200);
  return bmr*1.1+kcalPasos+kcalGym+kcalCardio;
}
// Gasto estimado final: si tienes kcal reales de tu reloj/app ese día, mandan ellas.
// Si no, se usa la fórmula (base + corrección aprendida de las recalibraciones).
function gastoEstimadoFecha(fechaISO){
  const row=DIARIO[fechaISO];
  if(row && row.kcal_app!=null) return row.kcal_app;
  const base=gastoBaseFecha(fechaISO);
  if(base==null) return null;
  return base+(PERFIL&&PERFIL.ajuste_gasto_kcal||0);
}
function gastoEsDeApp(fechaISO){
  const row=DIARIO[fechaISO];
  return !!(row && row.kcal_app!=null);
}
// balance<0 → déficit (bien) · balance>0 → superávit
function balanceFecha(fechaISO){
  const gasto=gastoEstimadoFecha(fechaISO);
  if(gasto==null) return null;
  return kcalConsumidasFecha(fechaISO)-gasto;
}
// Balance diario objetivo (kcal), a partir del ritmo de cambio de peso deseado (kg/semana).
// Negativo = déficit objetivo, positivo = superávit objetivo. 1kg de grasa ≈ 7700kcal.
function objetivoBalanceDia(){
  if(!PERFIL||PERFIL.ritmo_semanal_kg==null) return null;
  return PERFIL.ritmo_semanal_kg*7700/7;
}
// Objetivo de proteína en gramos para una fecha, según g/kg de peso configurado en el perfil.
function proteinaObjetivoFecha(fechaISO){
  if(!PERFIL||PERFIL.proteina_objetivo_gkg==null) return null;
  const peso=pesoParaFecha(fechaISO);
  if(peso==null) return null;
  return PERFIL.proteina_objetivo_gkg*peso;
}

// Info del ciclo para una fecha: día del ciclo y fase estimada
function cicloInfoFecha(fechaISO){
  if(!CICLOS.length) return null;
  const date=new Date(fechaISO+'T00:00:00');
  let ultimo=null;
  CICLOS.forEach(c=>{
    const ci=new Date(c.fecha_inicio+'T00:00:00');
    if(ci<=date && (!ultimo||ci>new Date(ultimo.fecha_inicio+'T00:00:00'))) ultimo=c;
  });
  if(!ultimo) return null;
  const diaCiclo=Math.floor((date-new Date(ultimo.fecha_inicio+'T00:00:00'))/(1000*60*60*24))+1;
  const dur=(PERFIL&&PERFIL.duracion_ciclo_media)||28;
  const mid=Math.round(dur/2);
  let fase='folicular', emoji='🌷';
  if(diaCiclo>=mid-1 && diaCiclo<=mid+1){ fase='ovulacion'; emoji='🌕'; }
  else if(diaCiclo>mid+1){ fase='lutea'; emoji='🌙'; }
  return {diaCiclo,fase,emoji,inicio:ultimo.fecha_inicio};
}

async function recalibrarDuracionCiclo(){
  if(!sb||CICLOS.length<2) return;
  const fechas=CICLOS.map(c=>new Date(c.fecha_inicio+'T00:00:00')).sort((a,b)=>a-b);
  const diffs=[]; for(let i=1;i<fechas.length;i++) diffs.push(Math.round((fechas[i]-fechas[i-1])/(1000*60*60*24)));
  const media=diffs.reduce((a,b)=>a+b,0)/diffs.length;
  if(media>=15&&media<=45){
    try{
      await sb.from('perfil').update({duracion_ciclo_media:media}).eq('id',1);
      if(PERFIL) PERFIL.duracion_ciclo_media=media;
    }catch(e){ console.warn('No se pudo recalibrar la duración del ciclo:',e); }
  }
}

// Recalibración semanal del gasto estimado: compara cómo ha variado tu peso real
// contra lo que predecía el déficit registrado, y ajusta ajuste_gasto_kcal poco a poco.
async function recalibrarGastoSiToca(){
  if(!sb||!PERFIL) return;
  const hoy=isoDate(new Date());
  if(PERFIL.ultima_recalibracion){
    const dias=Math.floor((new Date(hoy)-new Date(PERFIL.ultima_recalibracion))/(1000*60*60*24));
    if(dias<7) return;
  }
  const ventana=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); ventana.push(isoDate(d)); }
  const puntos=ventana.map(f=>{
    const row=DIARIO[f];
    if(!row||row.peso==null) return null;
    const gastoBase=gastoBaseFecha(f);
    if(gastoBase==null) return null;
    const ciclo=cicloInfoFecha(f);
    return {fecha:f,peso:row.peso,lutea:ciclo&&ciclo.fase==='lutea',gastoBase,kcalCons:kcalConsumidasFecha(f)};
  }).filter(Boolean);
  if(puntos.length<8) return; // no hay suficiente histórico todavía

  const peso_w=p=>p.lutea?0.4:1; // pesa menos los días de fase lútea (retención de agua)
  const mediaPonderada=arr=>{ let sw=0,sv=0; arr.forEach(p=>{const w=peso_w(p); sw+=w; sv+=p.peso*w;}); return sw?sv/sw:null; };
  const mitad=Math.floor(puntos.length/2);
  const pesoIni=mediaPonderada(puntos.slice(0,mitad)), pesoFin=mediaPonderada(puntos.slice(mitad));
  if(pesoIni==null||pesoFin==null) return;

  const cambioKcalReal=(pesoFin-pesoIni)*7700;
  const deficitEstimadoAcum=puntos.reduce((s,p)=>s+(p.gastoBase+(PERFIL.ajuste_gasto_kcal||0)-p.kcalCons),0);
  const errorKcal=(-cambioKcalReal)-deficitEstimadoAcum;
  const correccionDiaria=errorKcal/puntos.length;
  let nuevoAjuste=(PERFIL.ajuste_gasto_kcal||0)+correccionDiaria*0.5; // aplicar solo la mitad, para suavizar
  nuevoAjuste=Math.max(-500,Math.min(500,nuevoAjuste));

  try{
    await sb.from('perfil').update({ajuste_gasto_kcal:nuevoAjuste,ultima_recalibracion:hoy}).eq('id',1);
    PERFIL.ajuste_gasto_kcal=nuevoAjuste; PERFIL.ultima_recalibracion=hoy;
  }catch(e){ console.warn('No se pudo recalibrar el gasto:',e); }
}

// ── Gráfico de peso: línea continua de TODO el historial, con sombreado ──
// ── de fase lútea, para que el "reset" mensual no la corte nunca.        ──
function pesoChartDiarioSVG(minX,maxX){
  const puntos=Object.values(DIARIO).filter(r=>r.peso!=null).filter(r=>{
    const t=new Date(r.fecha+'T00:00:00').getTime(); return t>=minX&&t<=maxX;
  }).sort((a,b)=>a.fecha<b.fecha?-1:1);

  // Serie diaria continua (arrastrando el último peso conocido, incluso de antes del rango)
  // para poder calcular una media móvil de 7 días que suavice el ruido de agua/ciclo.
  const serieDiaria=[];
  for(let t=minX;t<=maxX;t+=86400000){
    const info=pesoInfoFecha(isoDate(new Date(t)));
    if(info) serieDiaria.push({t,peso:info.peso});
  }
  if(!serieDiaria.length) return null;
  const ventana=7;
  const media7=serieDiaria.map((d,i)=>{
    const desde=Math.max(0,i-ventana+1);
    const slice=serieDiaria.slice(desde,i+1).map(x=>x.peso);
    return {t:d.t,peso:slice.reduce((a,b)=>a+b,0)/slice.length};
  });

  const W=680,H=170,padL=34,padR=10,padT=14,padB=22;
  const pesos=puntos.map(p=>p.peso).concat(media7.map(p=>p.peso));
  let minY=Math.min(...pesos)-0.4, maxY=Math.max(...pesos)+0.4;
  if(maxY-minY<1){ const c=(maxY+minY)/2; minY=c-0.5; maxY=c+0.5; }
  const xScale=t=> maxX===minX ? (W-padL-padR)/2+padL : padL+(t-minX)/(maxX-minX)*(W-padL-padR);
  const yScale=v=> H-padB-(v-minY)/(maxY-minY)*(H-padT-padB);

  // sombreado de fase lútea por ciclo
  let shading='';
  if(CICLOS.length){
    const ordenados=CICLOS.map(c=>c.fecha_inicio).sort();
    const dur=(PERFIL&&PERFIL.duracion_ciclo_media)||28;
    ordenados.forEach((inicio,i)=>{
      const dStart=new Date(inicio+'T00:00:00');
      const luteaStart=new Date(dStart); luteaStart.setDate(luteaStart.getDate()+Math.round(dur/2)+1);
      const fin=i<ordenados.length-1?new Date(ordenados[i+1]+'T00:00:00'):new Date(dStart.getTime()+dur*86400000);
      if(luteaStart.getTime()>=fin.getTime()) return;
      const x1=xScale(Math.max(luteaStart.getTime(),minX)), x2=xScale(Math.min(fin.getTime(),maxX));
      if(x2>x1) shading+=`<rect x="${x1.toFixed(1)}" y="${padT}" width="${(x2-x1).toFixed(1)}" height="${H-padT-padB}" fill="var(--berry-light)" opacity=".6"/>`;
    });
  }
  // Puntos crudos: puntitos finos (ruido diario), sin conectar con línea gruesa.
  const rawDots=puntos.map(p=>{
    const t=new Date(p.fecha+'T00:00:00').getTime();
    return `<circle cx="${xScale(t).toFixed(1)}" cy="${yScale(p.peso).toFixed(1)}" r="1.6" fill="var(--ink-soft)" opacity=".45"/>`;
  }).join('');
  // Media móvil 7 días: la línea principal, más gruesa y suave.
  const mediaPath=media7.map((p,i)=>`${i===0?'M':'L'}${xScale(p.t).toFixed(1)},${yScale(p.peso).toFixed(1)}`).join(' ');
  const dots=CICLOS.map(c=>{
    const t=new Date(c.fecha_inicio+'T00:00:00').getTime();
    if(t<minX||t>maxX) return '';
    return `<circle cx="${xScale(t).toFixed(1)}" cy="${padT+4}" r="3" fill="var(--berry)"/>`;
  }).join('');
  const fmtEje=d=>new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${shading}
    <line x1="${padL}" y1="${yScale(minY+ (maxY-minY)/2).toFixed(1)}" x2="${W-padR}" y2="${yScale(minY+(maxY-minY)/2).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3"/>
    ${rawDots}
    <path d="${mediaPath}" fill="none" stroke="var(--sage)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${padL}" y="${H-6}" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${fmtEje(minX)}</text>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${fmtEje(maxX)}</text>
    <text x="${padL}" y="${padT+8}" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${maxY.toFixed(1)}</text>
    <text x="${padL}" y="${H-padB}" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${minY.toFixed(1)}</text>
  </svg>`;
}

// Vista anual: media de peso por mes (línea con huecos en los meses sin datos).
function pesoChartAnualSVG(year){
  const W=680,H=170,padL=34,padR=10,padT=14,padB=26;
  const meses=[];
  for(let m=0;m<12;m++){
    const entradas=Object.values(DIARIO).filter(r=>{
      if(r.peso==null) return false;
      const d=new Date(r.fecha+'T00:00:00');
      return d.getFullYear()===year && d.getMonth()===m;
    });
    meses.push({m,avg:entradas.length?entradas.reduce((a,b)=>a+b.peso,0)/entradas.length:null,n:entradas.length});
  }
  const conDato=meses.filter(d=>d.avg!=null);
  if(!conDato.length) return null;
  const pesos=conDato.map(d=>d.avg);
  let minY=Math.min(...pesos)-0.4, maxY=Math.max(...pesos)+0.4;
  if(maxY-minY<1){ const c=(maxY+minY)/2; minY=c-0.5; maxY=c+0.5; }
  const xScale=m=>padL+(m+0.5)/12*(W-padL-padR);
  const yScale=v=>H-padB-(v-minY)/(maxY-minY)*(H-padT-padB);
  let path='',started=false;
  meses.forEach(d=>{
    if(d.avg==null){ started=false; return; }
    path+=(started?'L':'M')+xScale(d.m).toFixed(1)+','+yScale(d.avg).toFixed(1)+' ';
    started=true;
  });
  const dots=conDato.map(d=>`<circle cx="${xScale(d.m).toFixed(1)}" cy="${yScale(d.avg).toFixed(1)}" r="2.8" fill="var(--sage)"/>`).join('');
  const labels=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const xLabels=meses.map(d=>`<text x="${xScale(d.m).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${labels[d.m]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${padL}" y1="${yScale(minY+(maxY-minY)/2).toFixed(1)}" x2="${W-padR}" y2="${yScale(minY+(maxY-minY)/2).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3"/>
    <path d="${path.trim()}" fill="none" stroke="var(--sage)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xLabels}
    <text x="${padL}" y="${padT+8}" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${maxY.toFixed(1)}</text>
    <text x="${padL}" y="${H-padB}" font-size="9" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${minY.toFixed(1)}</text>
  </svg>`;
}

function pesoChartSVG(){
  if(diarioChartMode==='mes'){
    const y=diarioMonthDate.getFullYear(), m=diarioMonthDate.getMonth();
    const inicio=new Date(y,m,1).getTime();
    const hoy=new Date(); hoy.setHours(0,0,0,0);
    const esMesActual=y===hoy.getFullYear()&&m===hoy.getMonth();
    const fin=esMesActual?hoy.getTime():new Date(y,m+1,0).getTime();
    return pesoChartDiarioSVG(inicio,fin);
  }
  if(diarioChartMode==='anio'){
    return pesoChartAnualSVG(diarioChartYear);
  }
  // 'todo': todo el histórico disponible
  const puntos=Object.values(DIARIO).filter(r=>r.peso!=null);
  if(!puntos.length) return null;
  const fechas=puntos.map(p=>new Date(p.fecha+'T00:00:00').getTime());
  return pesoChartDiarioSVG(Math.min(...fechas),Math.max(...fechas));
}

function getWeekMonday(weekIdx){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const diffDias=Math.floor((hoy-SEMANA1_INICIO)/(1000*60*60*24));
  const semanaActual=Math.floor(diffDias/7);
  const offsetSemanas=weekIdx-(semanaActual%4);
  const d=hoy.getDay(), diff=d===0?-6:1-d;
  const mon=new Date(hoy);
  mon.setDate(hoy.getDate()+diff+(offsetSemanas*7));
  mon.setHours(0,0,0,0);
  return mon;
}

function renderWeekDots(){
  const dotsEl=document.getElementById('week-dots');
  dotsEl.innerHTML=SEMANAS.map((s,i)=>
    `<div class="week-dot ${i===currentWeek?'active':''}" onclick="goToWeek(${i})" title="${SEM_L[i]}"></div>`
  ).join('');
}

function goToWeek(idx){
  currentWeek=idx; selectedDay=null;
  renderWeekDots(); renderCal();
}

function prevWeek(){
  if(currentWeek>0){currentWeek--;selectedDay=null;renderWeekDots();renderCal();}
}
function nextWeek(){
  if(currentWeek<3){currentWeek++;selectedDay=null;renderWeekDots();renderCal();}
}

function renderCal(){
  const sem=getCurrentSemana();
  const mon=getWeekMonday(currentWeek);
  const today=new Date(); today.setHours(0,0,0,0);
  const end=new Date(mon); end.setDate(mon.getDate()+6);
  const fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});

  document.getElementById('week-label').textContent=SEM_L[currentWeek];
  document.getElementById('week-range').textContent=fmt(mon)+' – '+fmt(end);
  document.getElementById('btn-prev').disabled=currentWeek===0;
  document.getElementById('btn-next').disabled=currentWeek===3;

  const heads=DIAS.map(d=>`<div class="cal-head">${DIAS_S[d]}</div>`).join('');
  const cells=DIAS.map((dia,i)=>{
    const date=new Date(mon); date.setDate(mon.getDate()+i); date.setHours(0,0,0,0);
    const fecha=isoDate(date);
    const dm=getMenuDia(dia);
    const {kcal}=computeRealDia(dia,fecha,dm);
    const dots=TIPOS.map(t=>{
      const r=getR(dm[t]);
      if(!r && !REGISTRO[regKey(fecha,t)]) return '';
      return `<div class="cal-dot dot-${t}"></div>`;
    }).join('');
    const tieneRegistro=TIPOS.concat(['postre_comida','postre_cena']).some(t=>REGISTRO[regKey(fecha,t)]);
    const isToday=date.getTime()===today.getTime();
    const isSel=selectedDay===dia;
    return `<div class="cal-cell ${isToday?'today':''} ${kcal>0?'has-food':''} ${isSel?'selected':''}" onclick="selectDay('${dia}')">
      <div class="cal-num">${date.getDate()}</div>
      ${tieneRegistro?'<div class="cal-check">✓</div>':''}

// Anillo SVG de reparto calórico entre proteína / carbos / grasas (kcal aportadas por cada macro)
function macroRingSVG(tp,tc,tg,tk,size){
  size=size||64;
  const r=size/2-6, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const kP=tp*4, kC=tc*4, kG=tg*9, total=kP+kC+kG;
  if(total<=0){
    return `<svg class="day-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" class="day-kcal-num" font-size="11">--</text>
    </svg>`;
  }
  const segs=[
    {v:kP,color:'var(--sage)'},
    {v:kC,color:'var(--gold)'},
    {v:kG,color:'var(--plum)'}
  ];
  let offset=0, arcs='';
  segs.forEach(s=>{
    const len=(s.v/total)*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="7"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=len;
  });
  return `<svg class="day-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="7"/>
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="day-kcal-num" font-size="14">${Math.round(tk)}</text>
    <text x="${cx}" y="${cy+11}" text-anchor="middle" fill="rgba(251,246,234,.7)" font-size="7" font-family="Inter,sans-serif" font-weight="700" letter-spacing="0.05em">KCAL</text>
  </svg>`;
}

/* ══════════ REGISTRO REAL (lo que de verdad has comido) ══════════ */

function parseLeadingNum(s){
  if(s===null||s===undefined) return null;
  const m=String(s).match(/[\d]+([.,]\d+)?/);
  return m?parseFloat(m[0].replace(',','.')):null;
}
function calcRowMacros(row){
  const orig=parseLeadingNum(row.cantidad_orig);
  const real=parseLeadingNum(row.cantidad_real);
  const factor= row.skip?0:((orig&&orig>0&&real!==null)?real/orig:1);
  return {
    kcal:(row.kcal_orig||0)*factor, proteinas:(row.proteinas_orig||0)*factor,
    carbos:(row.carbos_orig||0)*factor, grasas:(row.grasas_orig||0)*factor
  };
}
function ingredientesDesdeReceta(rec){
  return (rec.ingredientes||[]).map(i=>({
    nombre:i.nombre, cantidad_orig:i.cantidad, cantidad_real:i.cantidad,
    kcal_orig:i.kcal||0, proteinas_orig:i.proteinas||0, carbos_orig:i.carbos||0, grasas_orig:i.grasas||0, skip:false
  }));
}

function openRgModal(tipo,dia,fecha){
  const dm=getMenuDia(dia);
  const planR=getR(dm[tipo]);
  const reg=REGISTRO[regKey(fecha,tipo)];
  const esPostre=tipo.indexOf('postre_')===0;

  rgState={tipo,dia,fecha,esPostre,planR,fuente:null,ingredientes:[],extras:[],
    libreNombre:'', otraRecetaId:null, notas:'', buscando:'', buscandoIng:''};

  if(reg){
    rgState.fuente=reg.estado;
    rgState.notas=reg.notas||'';
    if(reg.estado==='como_plan'||reg.estado==='otra_receta'||reg.estado==='libre'){
      rgState.otraRecetaId=reg.estado==='otra_receta'?reg.receta_id:null;
      const arr=(reg.ingredientes||[]).filter(x=>!x.extra).map(x=>({...x}));
      const extras=(reg.ingredientes||[]).filter(x=>x.extra).map(x=>({...x}));
      rgState.ingredientes=arr.length?arr:(reg.estado==='como_plan'&&planR?ingredientesDesdeReceta(planR):[]);
      rgState.extras=extras;
      if(reg.estado==='libre') rgState.libreNombre=reg.nombre_libre||'';
    }
  } else {
    rgState.fuente=planR?'como_plan':'libre';
    if(planR) rgState.ingredientes=ingredientesDesdeReceta(planR);
  }

  const fechaFmt=new Date(fecha+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('rg-modal-title').textContent=`${TIPO_I[tipo]||'🍮'} ${(tipo.replace('postre_','postre ')).replace('_',' ')} · ${fechaFmt}`;
  renderRgModalBody();
  document.getElementById('rg-modal').classList.add('open');
}
function closeRgOut(e){ if(e.target===document.getElementById('rg-modal')) closeRgModal(); }
function closeRgModal(){ document.getElementById('rg-modal').classList.remove('open'); rgState=null; }

function setRgFuente(f){
  rgState.fuente=f;
  if(f==='como_plan'&&rgState.planR){ rgState.ingredientes=ingredientesDesdeReceta(rgState.planR); rgState.extras=[]; rgState.otraRecetaId=null; }
  if(f==='otra_receta'){ rgState.ingredientes=[]; rgState.extras=[]; rgState.buscando=''; }
  if(f==='libre'){ rgState.ingredientes=[]; rgState.extras=[]; rgState.buscandoIng=''; }

}

function updateRgRowDisplay(idx){
  const el=document.getElementById('ring-kcal-'+idx);
  if(el){ const m=calcRowMacros(rgState.ingredientes[idx]); el.textContent=Math.round(m.kcal)+' kcal'; }
  const row=document.getElementById('ring-row-'+idx);
  if(row) row.classList.toggle('skipped',!!rgState.ingredientes[idx].skip);
}

function rgComputeTotals(){
  if(!rgState) return {kcal:0,proteinas:0,carbos:0,grasas:0};
  if(rgState.fuente==='no_comido') return {kcal:0,proteinas:0,carbos:0,grasas:0};
  let kcal=0,proteinas=0,carbos=0,grasas=0;
  rgState.ingredientes.forEach(r=>{const m=calcRowMacros(r);kcal+=m.kcal;proteinas+=m.proteinas;carbos+=m.carbos;grasas+=m.grasas;});
  (rgState.extras||[]).forEach(e=>{kcal+=e.kcal||0;proteinas+=e.proteinas||0;carbos+=e.carbos||0;grasas+=e.grasas||0;});
  return {kcal,proteinas,carbos,grasas};
}
function updateRgTotalsDisplay(){
  const t=rgComputeTotals();
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('rg-tot-kcal',Math.round(t.kcal));
  set('rg-tot-p',Math.round(t.proteinas)+'g');
  set('rg-tot-c',Math.round(t.carbos)+'g');
  set('rg-tot-g',Math.round(t.grasas)+'g');
}

function renderRgModalBody(){

  let body='';

    if(qi){
      const listi=catalogoIngredientes().filter(i=>i.nombre.toLowerCase().includes(qi)).slice(0,30);
      if(listi.length){
        body+=`<div class="rg-recipe-picker">${listi.map(i=>`<div class="rg-rp-item" onclick="rgAddIngredienteCatalogo('${i.id}')"><span>${i.nombre}</span><span class="rpk">${i.unidad} · ${Math.round(i.kcal)} kcal</span></div>`).join('')}</div>`;
      } else {
        body+=`<div class="rg-recipe-picker"><div class="rg-rp-item" onclick="rgAddExtraConNombre('${qi.replace(/'/g,"\\'")}')"><span>Sin resultados para «${s.buscandoIng}»</span><span class="rpk">+ crear nuevo</span></div></div>`;
      }
    }
    if(s.ingredientes.length){
      body+=s.ingredientes.map((row,idx)=>{
        const m=calcRowMacros(row);
        const esCatalogo=row.origen==='catalogo';
        const etiqueta=esCatalogo?('cat.: '+row.cantidad_orig):('plan: '+row.cantidad_orig);
        const accion=esCatalogo
          ?`<button class="ring-skip" onclick="rgDelIngrediente(${idx})" title="Quitar">🗑</button>`
          :`<button class="ring-skip ${row.skip?'on':''}" onclick="rgToggleSkip(${idx})" title="No lo comí">🚫</button>`;
        return `<div class="ring-row ${row.skip?'skipped':''}" id="ring-row-${idx}">
          <div class="ring-name">${row.nombre}<span class="orig">${etiqueta}</span></div>
          <div class="ring-qty"><input type="text" value="${row.cantidad_real}" oninput="rgUpdateQty(${idx},this.value)"></div>
          <div class="ring-kcal" id="ring-kcal-${idx}">${Math.round(m.kcal)} kcal</div>
          ${accion}
        </div>`;
      }).join('');
    }
    if(s.extras&&s.extras.length){
      body+=s.extras.map((e,idx)=>`<div class="rg-extra-row">
        <input type="text" placeholder="Ingrediente" value="${e.nombre}" oninput="rgUpdateExtra(${idx},'nombre',this.value)">
        <input type="text" placeholder="cant." value="${e.cantidad_real||''}" oninput="rgUpdateExtra(${idx},'cantidad_real',this.value)">
        <input type="number" placeholder="kcal" value="${e.kcal||''}" oninput="rgUpdateExtra(${idx},'kcal',this.value)">
        <input type="number" placeholder="prot" value="${e.proteinas||''}" oninput="rgUpdateExtra(${idx},'proteinas',this.value)">
        <input type="number" placeholder="carb" value="${e.carbos||''}" oninput="rgUpdateExtra(${idx},'carbos',this.value)">
        <input type="number" placeholder="gras" value="${e.grasas||''}" oninput="rgUpdateExtra(${idx},'grasas',this.value)">
        <button class="rg-extra-del" onclick="rgDelExtra(${idx})">✕</button>
      </div>`).join('');
    }
    body+=`<button class="rg-add-extra" onclick="rgAddExtra()">+ Añadir ingrediente a mano (sin catálogo)</button>`;
  } else if(s.fuente==='no_comido'){
    body+=`<div class="rg-empty-msg">🚫 Se registrará como que no comiste esto, sin sumar calorías al día.</div>`;
  }

  const totalsHtml = s.fuente==='no_comido' ? '' : `
    <div class="rg-totals">
      <div><span class="tv" id="rg-tot-kcal">0</span><span class="tl">kcal</span></div>
      <div><span class="tv" id="rg-tot-p">0g</span><span class="tl">prot</span></div>
      <div><span class="tv" id="rg-tot-c">0g</span><span class="tl">carb</span></div>
      <div><span class="tv" id="rg-tot-g">0g</span><span class="tl">gras</span></div>
    </div>`;

  const existeReg=!!REGISTRO[regKey(s.fecha,s.tipo)];
  modalBodyEl.innerHTML = tabs + body + totalsHtml + `
    <div class="rg-actions">
      ${existeReg?`<button class="rg-btn rg-btn-del" onclick="deleteRegistro()">Quitar registro</button>`:''}
      <button class="rg-btn rg-btn-save" onclick="saveRegistro()">Guardar</button>
    </div>`;
  updateRgTotalsDisplay();

  if(activeId){
    const el=document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange){ try{ el.setSelectionRange(selStart,selStart); }catch(e){} } }
  }
}

async function saveRegistro(){
  const s=rgState; if(!s) return;
  if(!sb){ alert('Falta configurar Supabase (SUPABASE_URL / SUPABASE_ANON_KEY) en el código.'); return; }
  if(s.fuente==='otra_receta'&&!s.otraRecetaId&&!s.ingredientes.length){ alert('Elige una receta primero.'); return; }

  const t=rgComputeTotals();
  const recNombre = s.fuente==='como_plan'?(s.planR?s.planR.nombre:null) : s.fuente==='otra_receta'?(getR(s.otraRecetaId)?.nombre||null) : null;
  const ingredientesGuardar = (s.fuente==='como_plan'||s.fuente==='otra_receta'||s.fuente==='libre') ? [...s.ingredientes,...(s.extras||[])] : null;

  const row={
    fecha:s.fecha, tipo:s.tipo, estado:s.fuente,
    receta_id: s.fuente==='otra_receta'?s.otraRecetaId:(s.fuente==='como_plan'&&s.planR?s.planR.id:null),
    receta_nombre: recNombre,
    nombre_libre: s.fuente==='libre'?(s.libreNombre||null):null,
    ingredientes: ingredientesGuardar,
    kcal:t.kcal, proteinas:t.proteinas, carbos:t.carbos, grasas:t.grasas,
    notas: s.notas||null,
    updated_at: new Date().toISOString()
  };

  const body=document.getElementById('rg-modal-body'); body.classList.add('rg-saving');
  try{
    const {data,error}=await sb.from('registro_diario').upsert(row,{onConflict:'fecha,tipo'}).select().single();
    if(error){ alert('No se pudo guardar: '+error.message); return; }
    REGISTRO[regKey(s.fecha,s.tipo)]=data;
    await guardarIngredientesNuevos(s.extras);
    closeRgModal();
    renderCal();
  }catch(e){ alert('No se pudo guardar: '+e.message); }
  finally{ body.classList.remove('rg-saving'); }
}

// Guarda en Supabase los ingredientes escritos a mano que todavía no existían en el
// catálogo (ni en data.json ni en los ya guardados antes), para que a partir de ahora
// salgan en el buscador.
async function guardarIngredientesNuevos(extras){
  if(!sb || !extras || !extras.length) return;
  const existentes=new Set(catalogoIngredientes().map(i=>i.nombre.trim().toLowerCase()));
  const vistos=new Set();
  const nuevos=[];
  extras.forEach(e=>{
    const nombre=(e.nombre||'').trim();
    const clave=nombre.toLowerCase();
    if(!nombre || existentes.has(clave) || vistos.has(clave)) return;
    vistos.add(clave);
    nuevos.push({
      nombre,
      unidad:(e.cantidad_real&&String(e.cantidad_real).trim())||'1 unidad',
      kcal:e.kcal||0, proteinas:e.proteinas||0, carbos:e.carbos||0, grasas:e.grasas||0
    });
  });
  if(!nuevos.length) return;
  try{
    const {data,error}=await sb.from('ingredientes').insert(nuevos).select();
    if(error){ console.warn('No se pudieron guardar ingredientes nuevos:',error.message); return; }
    if(data) INGREDIENTES_EXTRA=INGREDIENTES_EXTRA.concat(data);
  }catch(e){ console.warn('No se pudieron guardar ingredientes nuevos:',e); }
}

async function deleteRegistro(){
  const s=rgState; if(!s||!sb) return;
  if(!confirm('¿Quitar este registro y volver a lo planificado?')) return;
  try{
    const {error}=await sb.from('registro_diario').delete().eq('fecha',s.fecha).eq('tipo',s.tipo);
    if(error){ alert('No se pudo borrar: '+error.message); return; }
    delete REGISTRO[regKey(s.fecha,s.tipo)];
    closeRgModal();
    renderCal();
  }catch(e){ alert('No se pudo borrar: '+e.message); }
}

loadData();
