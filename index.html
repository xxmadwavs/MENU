<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* despensa / jardín — paleta propia */
  --paper:       #f3efe2;
  --paper-raised:#fffdf8;
  --ink:         #262b1f;
  --ink-soft:    #71715f;
  --line:        #e2dbc4;

  --green:       #33472c;
  --green-deep:  #23301e;
  --green-light: #e7ebdd;

  --gold:        #cf9a3e;
  --gold-deep:   #a97928;
  --gold-light:  #f8ecd2;

  --clay:        #b3573d;
  --clay-light:  #f6e3da;

  --plum:        #6c4569;
  --plum-light:  #ece2ea;

  --sage:        #728a5d;
  --sage-light:  #e7edde;

  --berry:       #a24f68;
  --berry-light: #f4e1e7;

  --r:    18px;
  --r-sm: 11px;
  --shadow: 0 3px 14px rgba(38,43,31,.07);
  --shadow-lg: 0 10px 34px rgba(38,43,31,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  background-image:radial-gradient(circle at 100% 0%, rgba(207,154,62,.08), transparent 45%);
  color:var(--ink);
  min-height:100vh;
  font-size:15px;
  padding-bottom:74px;
}
h1,h2,.font-display{font-family:'Fraunces',serif}
.mono{font-family:'IBM Plex Mono',monospace}

/* HEADER */
header{
  background:linear-gradient(160deg,var(--green) 0%,var(--green-deep) 100%);
  padding:1.15rem 1.25rem 1.3rem;
  position:sticky;top:0;z-index:100;
  box-shadow:0 6px 20px rgba(35,48,30,.22);
  border-bottom:3px solid var(--gold);
}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(207,154,62,.5);
  display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;
}
header h1{font-size:1.28rem;font-weight:600;color:#fbf6ea;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:.72rem;color:rgba(251,246,234,.65);margin-top:2px;text-transform:capitalize;letter-spacing:.02em}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:150;
  background:var(--paper-raised);
  border-top:1px solid var(--line);
  display:flex;
  box-shadow:0 -6px 20px rgba(38,43,31,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:.6rem .25rem .55rem;
  color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:.66rem;font-weight:600;
  letter-spacing:.02em;position:relative;transition:color .15s;
}
.nav-btn .nav-icon{font-size:1.15rem;transition:transform .18s}
.nav-btn.active{color:var(--green)}
.nav-btn.active .nav-icon{transform:translateY(-2px)}
.nav-btn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold);
}

.view{display:none;padding:1.05rem 1.1rem 1.5rem}
.view.active{display:block}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4.5rem 1rem;color:var(--ink-soft);gap:1rem}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* WEEK NAV */
.week-nav{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;
  background:var(--paper-raised);border-radius:var(--r);padding:.6rem .7rem;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.week-nav button{
  background:var(--green-light);border:none;width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-size:1.15rem;color:var(--green);display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.week-nav button:hover{background:var(--green);color:#fff}
.week-nav button:disabled{opacity:.28;cursor:default}
.week-nav button:disabled:hover{background:var(--green-light);color:var(--green)}
.week-nav-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.week-nav-label{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--green-deep);font-style:italic}
.week-nav-range{font-size:.66rem;color:var(--ink-soft);font-weight:500;letter-spacing:.01em}
.week-nav-dots{display:flex;gap:6px}
.week-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s;cursor:pointer}
.week-dot.active{background:var(--gold-deep);transform:scale(1.25)}

/* CALENDAR GRID */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:0;background:var(--paper-raised);
  border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);margin-bottom:.85rem;
}
.cal-head{
  background:var(--green);color:#f2ecda;text-align:center;padding:.5rem 2px;
  font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
}
.cal-cell{
  border-right:1px solid var(--line);border-top:1px solid var(--line);
  min-height:78px;cursor:pointer;transition:background .15s;position:relative;
  display:flex;flex-direction:column;align-items:center;padding-top:5px;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--gold-light)}
.cal-cell.today .cal-num{background:var(--gold-deep);color:#fff}
.cal-cell.has-food{background:#faf6ea}
.cal-cell.selected{background:var(--green-light);box-shadow:inset 0 0 0 2px var(--green);z-index:1}
.cal-num{font-size:.72rem;font-weight:700;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cal-dots{display:flex;gap:3px;padding:5px 0 3px;flex-wrap:wrap;justify-content:center;max-width:34px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-desayuno{background:var(--gold-deep)}
.dot-comida{background:var(--sage)}
.dot-cena{background:var(--plum)}
.dot-snack{background:var(--clay)}
.dot-postre{background:var(--berry)}
.cal-kcal{font-size:.6rem;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:center;line-height:1;padding-bottom:5px}

/* DAY PANEL */
.day-panel{background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:1rem}
.day-panel-head{
  background:linear-gradient(150deg,var(--green),var(--green-deep));
  padding:.95rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.day-panel-title{font-family:'Fraunces',serif;color:#fbf6ea;font-size:1.05rem;font-weight:600;font-style:italic;flex-shrink:0}
.day-ring-wrap{display:flex;align-items:center;gap:.8rem;margin-left:auto}
.day-ring{flex-shrink:0}
.day-kcal-num{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;fill:#fbf6ea}
.day-macro-legend{display:flex;flex-direction:column;gap:3px}
.dml-row{display:flex;align-items:center;gap:5px;font-size:.66rem;color:rgba(251,246,234,.85);font-weight:600}
.dml-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dml-row .mono{color:#fbf6ea}
.day-empty-badge{font-size:.72rem;color:rgba(251,246,234,.7);font-style:italic;margin-left:auto}

.meal-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.1rem;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.meal-item:last-child{border-bottom:none}
.meal-item:hover{background:var(--gold-light)}
.meal-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.mi-desayuno{background:var(--gold-light)}
.mi-comida{background:var(--sage-light)}
.mi-cena{background:var(--plum-light)}
.mi-snack{background:var(--clay-light)}
.meal-info{flex:1;min-width:0}
.meal-type-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-soft);margin-bottom:1px}
.meal-name-t{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-name-t.empty{color:var(--ink-soft);font-weight:400;font-style:italic}
.meal-macros-r{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.mm{font-size:.65rem;font-weight:700;font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:8px}
.mm-k{background:var(--clay-light);color:#8a3d27}
.mm-p{background:var(--sage-light);color:#3f5c2c}
.mm-c{background:var(--gold-light);color:#8a6416}
.mm-g{background:var(--plum-light);color:#523153}

/* RECIPES */
.recipe-search{
  width:100%;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.65rem .9rem;font-family:'Inter',sans-serif;font-size:.85rem;color:var(--ink);margin-bottom:.7rem;
  box-shadow:var(--shadow);
}
.recipe-search:focus{outline:none;border-color:var(--green)}
.recipe-search::placeholder{color:var(--ink-soft)}
.sub-tabs{display:flex;background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);padding:4px;margin-bottom:1rem;gap:3px;box-shadow:var(--shadow);overflow-x:auto}
.sub-tab{flex:1;text-align:center;padding:.45rem .2rem;border-radius:var(--r-sm);font-size:.72rem;font-weight:700;cursor:pointer;border:none;background:none;color:var(--ink-soft);transition:all .2s;white-space:nowrap}
.sub-tab.active{background:var(--green);color:#fbf6ea}
.recipe-count{font-size:.72rem;color:var(--ink-soft);font-weight:600;margin:0 0 .6rem 2px}
.recipes-grid{display:flex;flex-direction:column;gap:.7rem}
.recipe-card{background:var(--paper-raised);border-radius:var(--r);border:1px solid var(--line);padding:1rem 1.1rem;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.recipe-card:hover{border-color:var(--line);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.recipe-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.4rem;gap:.5rem}
.recipe-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;flex:1;line-height:1.3}
.recipe-time{font-size:.68rem;color:var(--gold-deep);background:var(--gold-light);padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:700;font-family:'IBM Plex Mono',monospace}
.recipe-desc{font-size:.81rem;color:var(--ink-soft);margin-bottom:.75rem;line-height:1.5}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mbox{border-radius:9px;padding:6px 4px;text-align:center}
.mbox .mv{font-size:.85rem;font-weight:700;display:block;font-family:'IBM Plex Mono',monospace}
.mbox .ml{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-top:2px}
.mb-k{background:var(--clay-light)}.mb-k .mv{color:#8a3d27}.mb-k .ml{color:#a3503a}
.mb-p{background:var(--sage-light)}.mb-p .mv{color:#3f5c2c}.mb-p .ml{color:#597a45}
.mb-c{background:var(--gold-light)}.mb-c .mv{color:#8a6416}.mb-c .ml{color:#a97e20}
.mb-g{background:var(--plum-light)}.mb-g .mv{color:#523153}.mb-g .ml{color:#6c4569}

/* SHOPPING */
.shop-week-tabs{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap}
.shop-week-btn{padding:.4rem .85rem;border-radius:20px;border:1.5px solid var(--line);background:var(--paper-raised);font-family:'Inter',sans-serif;font-size:.76rem;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .2s}
.shop-week-btn.active{background:var(--green);border-color:var(--green);color:#fbf6ea}
.info-bar{background:var(--gold-light);border-radius:var(--r);border:1px solid var(--line);padding:.7rem 1rem;margin-bottom:.75rem;font-size:.8rem;color:var(--gold-deep);font-weight:600;box-shadow:var(--shadow)}
.shop-progress{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r);padding:.7rem 1rem;margin-bottom:.75rem;box-shadow:var(--shadow)}
.shop-progress-top{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;color:var(--ink-soft);margin-bottom:.4rem}
.shop-progress-bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.shop-progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .25s}
.shop-item{background:var(--paper-raised);border-radius:var(--r-sm);border:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;margin-bottom:6px;cursor:pointer;transition:all .18s}
.shop-item:hover{border-color:var(--gold)}
.shop-item.checked{opacity:.5}
.shop-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--green);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.shop-item.checked .shop-check{background:var(--green);border-color:var(--green)}
.shop-item.checked .shop-check::after{content:'✓';color:#fbf6ea;font-size:.72rem;font-weight:700}
.shop-item.checked .stxt{text-decoration:line-through;color:var(--ink-soft)}
.stxt{font-size:.9rem;font-weight:600;flex:1}
.sqty{font-size:.76rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
.btn-reset{width:100%;background:none;border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:.65rem;font-family:'Inter',sans-serif;font-size:.83rem;font-weight:600;color:var(--ink-soft);cursor:pointer;margin-top:.75rem;transition:all .2s}
.btn-reset:hover{background:var(--clay-light);color:var(--clay);border-color:var(--clay)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(35,30,20,.55);z-index:200;padding:1rem;overflow-y:auto;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--paper-raised);border-radius:var(--r);width:100%;max-width:480px;margin-top:2rem;margin-bottom:2rem;overflow:hidden;box-shadow:0 24px 60px rgba(35,30,20,.3)}
.modal-head{background:linear-gradient(150deg,var(--green),var(--green-deep));color:#fbf6ea;padding:1.15rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;border-bottom:3px solid var(--gold)}
.modal-head h2{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;line-height:1.3;font-style:italic}
.modal-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fbf6ea;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.15rem 1.25rem}
.modal-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem}
.mm-box{border-radius:11px;padding:9px 4px;text-align:center}
.mm-box .v{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:600;display:block}
.mm-box .l{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-top:2px}
.sec-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.4rem}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--line)}
.ing-list{list-style:none}
.ing-list li{padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem;display:flex;justify-content:space-between;align-items:center}
.ing-list li:last-child{border-bottom:none}
.ing-qty{color:var(--ink-soft);font-size:.8rem;font-family:'IBM Plex Mono',monospace}
.steps-ol{list-style:none;counter-reset:s}
.steps-ol li{counter-increment:s;padding:.6rem 0 .6rem 2.3rem;border-bottom:1px solid var(--line);font-size:.86rem;line-height:1.55;position:relative;color:var(--ink)}
.steps-ol li:last-child{border-bottom:none}
.steps-ol li::before{content:counter(s);position:absolute;left:0;top:.6rem;width:21px;height:21px;background:var(--green);color:#fbf6ea;border-radius:50%;font-size:.66rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-soft)}
.empty-state .ei{font-size:2.4rem;margin-bottom:.75rem;opacity:.85}
.empty-state p{font-size:.9rem;line-height:1.55;max-width:280px;margin:0 auto}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">🌿</span>
    <div>
      <h1>Mi Menú</h1>
      <p class="brand-sub" id="today-label"></p>
    </div>
  </div>
</header>

<main>
<div id="view-calendario" class="view active">
  <div id="cal-loading" class="loading"><div class="spinner"></div><span>Cargando menú…</span></div>
  <div id="cal-content" style="display:none">
    <div class="week-nav">
      <button id="btn-prev" onclick="prevWeek()">‹</button>
      <div class="week-nav-center">
        <span class="week-nav-label" id="week-label"></span>
        <span class="week-nav-range" id="week-range"></span>
        <div class="week-nav-dots" id="week-dots"></div>
      </div>
      <button id="btn-next" onclick="nextWeek()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="day-panel" id="day-panel" style="display:none"></div>
  </div>
</div>

<div id="view-recetas" class="view">
  <input type="search" id="recipe-search" class="recipe-search" placeholder="Buscar receta por nombre…" oninput="renderRecipes(recipeFilter)">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="filterR('desayuno',this)">Desayuno</button>
    <button class="sub-tab" onclick="filterR('comida',this)">Comida</button>
    <button class="sub-tab" onclick="filterR('cena',this)">Cena</button>
    <button class="sub-tab" onclick="filterR('postre',this)">Postre</button>
    <button class="sub-tab" onclick="filterR('todas',this)">Todas</button>
  </div>
  <div class="recipe-count" id="recipe-count"></div>
  <div id="recipes-container" class="recipes-grid"></div>
</div>

<div id="view-compra" class="view">
  <div class="shop-week-tabs" id="shop-week-tabs"></div>
  <div class="shop-progress" id="shop-progress" style="display:none">
    <div class="shop-progress-top"><span id="shop-progress-label"></span><span id="shop-progress-pct" class="mono"></span></div>
    <div class="shop-progress-bar"><div class="shop-progress-fill" id="shop-progress-fill"></div></div>
  </div>
  <div class="info-bar">🧺 Lista de la semana seleccionada. Toca un ingrediente para marcarlo como comprado.</div>
  <div id="shopping-container"></div>
</div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showView('calendario',this)"><span class="nav-icon">🗓️</span><span>Calendario</span></button>
  <button class="nav-btn" onclick="showView('recetas',this)"><span class="nav-icon">📖</span><span>Recetas</span></button>
  <button class="nav-btn" onclick="showView('compra',this)"><span class="nav-icon">🧺</span><span>Compra</span></button>
</nav>

<div class="modal-overlay" id="modal" onclick="closeOut(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const DIAS=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_S={lunes:'L',martes:'M',miercoles:'X',jueves:'J',viernes:'V',sabado:'S',domingo:'D'};
const DIAS_L={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
const TIPOS=['desayuno','comida','cena','snack'];
const TIPO_I={desayuno:'☀️',comida:'🍽️',cena:'🌙',snack:'🍎'};
const SEMANAS=['semana1','semana2','semana3','semana4'];
const SEM_L=['Semana 1','Semana 2','Semana 3','Semana 4'];

// Semana 1 empezó el domingo 25 de mayo de 2026
const SEMANA1_INICIO = new Date(2026, 4, 25); // mes 4 = mayo (0-indexed)

function calcCurrentWeek(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diffMs = hoy - SEMANA1_INICIO;
  const diffDias = Math.floor(diffMs / (1000*60*60*24));
  const semanaNum = Math.floor(diffDias / 7);
  return ((semanaNum % 4) + 4) % 4; // siempre 0-3, funciona aunque sea negativo
}

let DATA=null, currentWeek=calcCurrentWeek(), selectedDay=null, checkedItems={}, recipeFilter='desayuno', shopWeek=calcCurrentWeek();

async function loadData(){
  try{
    const r=await fetch('data.json?t='+Date.now());
    DATA=await r.json();
  }catch(e){ DATA={recetas:[],menu:{}}; }
  document.getElementById('today-label').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('cal-loading').style.display='none';
  document.getElementById('cal-content').style.display='block';
  renderWeekDots();
  renderCal();
  renderRecipes('desayuno');
  renderShopTabs();
}

function getR(id){ return DATA.recetas.find(r=>r.id===id)||null; }

function getCurrentSemana(){ return SEMANAS[currentWeek % SEMANAS.length]; }

function getMenuDia(dia){
  const sem=getCurrentSemana();
  const menu=DATA.menu;
  if(menu[sem]) return menu[sem][dia]||{};
  return menu[dia]||{};
}

function showView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='compra') renderShopping();
}

function getWeekMonday(weekIdx){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const diffDias=Math.floor((hoy-SEMANA1_INICIO)/(1000*60*60*24));
  const semanaActual=Math.floor(diffDias/7);
  const offsetSemanas=weekIdx-(semanaActual%4);
  const d=hoy.getDay(), diff=d===0?-6:1-d;
  const mon=new Date(hoy);
  mon.setDate(hoy.getDate()+diff+(offsetSemanas*7));
  mon.setHours(0,0,0,0);
  return mon;
}

function renderWeekDots(){
  const dotsEl=document.getElementById('week-dots');
  dotsEl.innerHTML=SEMANAS.map((s,i)=>
    `<div class="week-dot ${i===currentWeek?'active':''}" onclick="goToWeek(${i})" title="${SEM_L[i]}"></div>`
  ).join('');
}

function goToWeek(idx){
  currentWeek=idx; selectedDay=null;
  renderWeekDots(); renderCal();
}

function prevWeek(){
  if(currentWeek>0){currentWeek--;selectedDay=null;renderWeekDots();renderCal();}
}
function nextWeek(){
  if(currentWeek<3){currentWeek++;selectedDay=null;renderWeekDots();renderCal();}
}

function renderCal(){
  const sem=getCurrentSemana();
  const mon=getWeekMonday(currentWeek);
  const today=new Date(); today.setHours(0,0,0,0);
  const end=new Date(mon); end.setDate(mon.getDate()+6);
  const fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});

  document.getElementById('week-label').textContent=SEM_L[currentWeek];
  document.getElementById('week-range').textContent=fmt(mon)+' – '+fmt(end);
  document.getElementById('btn-prev').disabled=currentWeek===0;
  document.getElementById('btn-next').disabled=currentWeek===3;

  const heads=DIAS.map(d=>`<div class="cal-head">${DIAS_S[d]}</div>`).join('');
  const cells=DIAS.map((dia,i)=>{
    const date=new Date(mon); date.setDate(mon.getDate()+i); date.setHours(0,0,0,0);
    const dm=getMenuDia(dia);
    let kcal=0;
    const dots=TIPOS.map(t=>{
      const r=getR(dm[t]); if(!r) return '';
      kcal+=r.kcal||0;
      return `<div class="cal-dot dot-${t}"></div>`;
    }).join('');
    const rpc=getR(dm['postre_comida']); if(rpc){kcal+=rpc.kcal||0;}
    const rpce=getR(dm['postre_cena']); if(rpce){kcal+=rpce.kcal||0;}
    const isToday=date.getTime()===today.getTime();
    const isSel=selectedDay===dia;
    return `<div class="cal-cell ${isToday?'today':''} ${kcal>0?'has-food':''} ${isSel?'selected':''}" onclick="selectDay('${dia}')">
      <div class="cal-num">${date.getDate()}</div>
      <div class="cal-dots">${dots}</div>
      ${kcal>0?`<div class="cal-kcal">${kcal}</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('cal-grid').innerHTML=heads+cells;
  const panel=document.getElementById('day-panel');
  if(selectedDay){ renderDayPanel(selectedDay); panel.style.display='block'; }
  else panel.style.display='none';
}

function selectDay(dia){
  selectedDay=selectedDay===dia?null:dia;
  renderCal();
  if(selectedDay){
    setTimeout(()=>document.getElementById('day-panel').scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  }
}

// Anillo SVG de reparto calórico entre proteína / carbos / grasas (kcal aportadas por cada macro)
function macroRingSVG(tp,tc,tg,tk,size){
  size=size||64;
  const r=size/2-6, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const kP=tp*4, kC=tc*4, kG=tg*9, total=kP+kC+kG;
  if(total<=0){
    return `<svg class="day-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" class="day-kcal-num" font-size="11">--</text>
    </svg>`;
  }
  const segs=[
    {v:kP,color:'var(--sage)'},
    {v:kC,color:'var(--gold)'},
    {v:kG,color:'var(--plum)'}
  ];
  let offset=0, arcs='';
  segs.forEach(s=>{
    const len=(s.v/total)*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="7"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=len;
  });
  return `<svg class="day-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="7"/>
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="day-kcal-num" font-size="14">${Math.round(tk)}</text>
    <text x="${cx}" y="${cy+11}" text-anchor="middle" fill="rgba(251,246,234,.7)" font-size="7" font-family="Inter,sans-serif" font-weight="700" letter-spacing="0.05em">KCAL</text>
  </svg>`;
}

function renderDayPanel(dia){
  const dm=getMenuDia(dia);
  let tk=0,tp=0,tc=0,tg=0;
  TIPOS.forEach(t=>{const r=getR(dm[t]);if(r){tk+=r.kcal||0;tp+=r.proteinas||0;tc+=r.carbos||0;tg+=r.grasas||0;}});
  ['postre_comida','postre_cena'].forEach(k=>{const r=getR(dm[k]);if(r){tk+=r.kcal||0;tp+=r.proteinas||0;tc+=r.carbos||0;tg+=r.grasas||0;}});

  let mealsHtml='';
  TIPOS.forEach(tipo=>{
    const r=getR(dm[tipo]);
    mealsHtml+=`<div class="meal-item" ${r?`onclick="openModal('${r.id}')"`:''}>
      <div class="meal-icon mi-${tipo}">${TIPO_I[tipo]}</div>
      <div class="meal-info">
        <div class="meal-type-label">${tipo}</div>
        <div class="meal-name-t ${!r?'empty':''}">${r?r.nombre:'Sin asignar'}</div>
        ${r?`<div class="meal-macros-r">
          <span class="mm mm-k">${r.kcal} kcal</span>
          <span class="mm mm-p">P: ${r.proteinas}g</span>
          <span class="mm mm-c">CH: ${r.carbos}g</span>
          <span class="mm mm-g">G: ${r.grasas}g</span>
        </div>`:''}
      </div>
    </div>`;
    const pKey = tipo==='comida'?'postre_comida': tipo==='cena'?'postre_cena':null;
    if(pKey){
      const rp=getR(dm[pKey]);
      if(rp) mealsHtml+=`<div class="meal-item" onclick="openModal('${rp.id}')" style="padding-left:2.6rem;background:var(--berry-light);">
        <div class="meal-icon" style="background:#fff;font-size:.8rem;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;">🍮</div>
        <div class="meal-info">
          <div class="meal-type-label">postre</div>
          <div class="meal-name-t" style="font-size:.85rem;">${rp.nombre}</div>
          <div class="meal-macros-r">
            <span class="mm mm-k">${rp.kcal} kcal</span>
            <span class="mm mm-p">P: ${rp.proteinas}g</span>
            <span class="mm mm-c">CH: ${rp.carbos}g</span>
            <span class="mm mm-g">G: ${rp.grasas}g</span>
          </div>
        </div>
      </div>`;
    }
  });

  document.getElementById('day-panel').innerHTML=`
    <div class="day-panel-head">
      <span class="day-panel-title">${DIAS_L[dia]}</span>
      ${tk>0?`
      <div class="day-ring-wrap">
        ${macroRingSVG(tp,tc,tg,tk,60)}
        <div class="day-macro-legend">
          <div class="dml-row"><span class="dml-dot" style="background:var(--sage)"></span>Prot <span class="mono">${Math.round(tp)}g</span></div>
          <div class="dml-row"><span class="dml-dot" style="background:var(--gold)"></span>Carb <span class="mono">${Math.round(tc)}g</span></div>
          <div class="dml-row"><span class="dml-dot" style="background:var(--plum)"></span>Gras <span class="mono">${Math.round(tg)}g</span></div>
        </div>
      </div>`:`<span class="day-empty-badge">Sin planificar</span>`}
    </div>
    <div>${mealsHtml}</div>
  `;
}

function filterR(tipo,btn){
  recipeFilter=tipo;
  document.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes(tipo);
}

function renderRecipes(tipo){
  const cont=document.getElementById('recipes-container');
  const q=(document.getElementById('recipe-search').value||'').toLowerCase().trim();
  let list=tipo==='todas'?DATA.recetas:DATA.recetas.filter(r=>r.tipo===tipo);
  if(q) list=list.filter(r=>(r.nombre||'').toLowerCase().includes(q));
  document.getElementById('recipe-count').textContent=list.length===1?'1 receta':`${list.length} recetas`;
  if(!list.length){
    cont.innerHTML=`<div class="empty-state"><div class="ei">🌱</div><p>${q?'Ninguna receta coincide con tu búsqueda.':'Todavía no hay recetas guardadas de este tipo. Añádelas desde el panel de administración.'}</p></div>`;
    return;
  }
  cont.innerHTML=list.map(r=>`
    <div class="recipe-card" onclick="openModal('${r.id}')">
      <div class="recipe-top">
        <div class="recipe-name">${r.nombre}</div>
        ${r.tiempo?`<span class="recipe-time">⏱ ${r.tiempo}</span>`:''}
      </div>
      ${r.descripcion?`<div class="recipe-desc">${r.descripcion}</div>`:''}
      <div class="macro-row">
        <div class="mbox mb-k"><span class="mv">${r.kcal}</span><span class="ml">kcal</span></div>
        <div class="mbox mb-p"><span class="mv">${r.proteinas}g</span><span class="ml">prot</span></div>
        <div class="mbox mb-c"><span class="mv">${r.carbos}g</span><span class="ml">carbos</span></div>
        <div class="mbox mb-g"><span class="mv">${r.grasas}g</span><span class="ml">grasas</span></div>
      </div>
    </div>
  `).join('');
}

function renderShopTabs(){
  const el=document.getElementById('shop-week-tabs');
  el.innerHTML=SEMANAS.map((s,i)=>
    `<button class="shop-week-btn ${i===shopWeek?'active':''}" onclick="setShopWeek(${i})">${SEM_L[i]}</button>`
  ).join('');
}

function setShopWeek(idx){
  shopWeek=idx; checkedItems={};
  renderShopTabs(); renderShopping();
}

function renderShopping(){
  const cont=document.getElementById('shopping-container');
  const sem=SEMANAS[shopWeek];
  const menuSem=DATA.menu[sem]||{};
  const map={};
  Object.values(menuSem).forEach(dm=>{
    TIPOS.forEach(t=>{
      const r=getR(dm[t]);
      if(r&&r.ingredientes) r.ingredientes.forEach(i=>{
        const key=i.nombre.toLowerCase().trim();
        if(!map[key]) map[key]={nombre:i.nombre,qtys:[]};
        map[key].qtys.push(i.cantidad);
      });
    });
  });
  const sorted=Object.values(map).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const progEl=document.getElementById('shop-progress');
  if(!sorted.length){
    progEl.style.display='none';
    cont.innerHTML=`<div class="empty-state"><div class="ei">🧺</div><p>No hay ingredientes en el menú de esta semana todavía.</p></div>`;
    return;
  }
  const checkedCount=sorted.filter(i=>checkedItems[i.nombre]).length;
  progEl.style.display='block';
  document.getElementById('shop-progress-label').textContent=`${checkedCount} de ${sorted.length} comprados`;
  document.getElementById('shop-progress-pct').textContent=Math.round((checkedCount/sorted.length)*100)+'%';
  document.getElementById('shop-progress-fill').style.width=Math.round((checkedCount/sorted.length)*100)+'%';
  cont.innerHTML=sorted.map(i=>{
    const k=i.nombre, ch=!!checkedItems[k], qty=[...new Set(i.qtys)].join(', ');
    return `<div class="shop-item ${ch?'checked':''}" onclick="toggleCheck('${k.replace(/'/g,"\\'")}')">
      <div class="shop-check"></div><span class="stxt">${i.nombre}</span><span class="sqty">${qty}</span>
    </div>`;
  }).join('')+`<button class="btn-reset" onclick="resetShop()">↺ Desmarcar todo</button>`;
}

function toggleCheck(k){checkedItems[k]=!checkedItems[k];renderShopping();}
function resetShop(){checkedItems={};renderShopping();}

function openModal(id){
  const r=getR(id); if(!r) return;
  document.getElementById('modal-title').textContent=r.nombre;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-macros">
      <div class="mm-box mb-k"><span class="v">${r.kcal}</span><span class="l">kcal</span></div>
      <div class="mm-box mb-p"><span class="v">${r.proteinas}g</span><span class="l">prot</span></div>
      <div class="mm-box mb-c"><span class="v">${r.carbos}g</span><span class="l">carbos</span></div>
      <div class="mm-box mb-g"><span class="v">${r.grasas}g</span><span class="l">grasas</span></div>
    </div>
    ${r.descripcion?`<p style="font-size:.86rem;color:var(--ink-soft);margin-bottom:.75rem;line-height:1.55">${r.descripcion}</p>`:''}
    ${r.tiempo?`<p style="font-size:.8rem;color:var(--gold-deep);margin-bottom:1rem;font-weight:700">⏱ ${r.tiempo}</p>`:''}
    ${r.ingredientes?.length?`<div class="sec-lbl">Ingredientes</div>
      <ul class="ing-list">${r.ingredientes.map(i=>`<li><span>${i.nombre}</span><span class="ing-qty">${i.cantidad}</span></li>`).join('')}</ul>`:''}
    ${r.pasos?.length?`<div class="sec-lbl">Preparación</div>
      <ol class="steps-ol">${r.pasos.map(p=>`<li>${p}</li>`).join('')}</ol>`:''}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeOut(e){if(e.target===document.getElementById('modal')) closeModal();}
function closeModal(){document.getElementById('modal').classList.remove('open');}

loadData();
</script>
